  <style>
    :root {
      --primary: #0374b4;
      --primary-dark: #025a8c;
      --accent: #00b894;
      --text: #1a1a2e;
      --text-light: #4a4a68;
      --bg: #ffffff;
      --bg-alt: #f8f9fa;
      --border: #e0e0e0;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    a {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.2s;
    }
    
    a:hover {
      color: var(--primary-dark);
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }
    
    header {
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border);
    }
    
    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo {
      font-family: 'Sora', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);

      align-items: center;
      justify-content: center;

      text-align: center;
    }

      font-family: 'JetBrains Mono', monospace;
      font-size: 8rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 1rem;
    }
    
    h1 {
      font-family: 'Sora', sans-serif;
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    
    p {
      color: var(--text-light);
      font-size: 1.125rem;
      margin-bottom: 2rem;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 1.75rem;
      background: var(--primary);
      color: white;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .btn:hover {
      background: var(--primary-dark);
      color: white;
      transform: translateY(-2px);
    }
    
    footer {
      padding: 1.5rem 0;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-light);
      font-size: 0.875rem;
    }

      nav {
        display: none;
      }
